name: E2E - Kind Cluster Tests (Tier 1)

# Tier 1: Runs on every push/PR as a CI gate.
# Builds the coordination-engine image, loads it into a Kind cluster,
# deploys via Helm, and verifies the health endpoint.

on:
  push:
    branches: [ main, develop, 'release-4.20', 'release-4.21', 'release-4.22' ]
  pull_request:
    branches: [ main, develop, 'release-4.20', 'release-4.21', 'release-4.22' ]

env:
  GO_VERSION: "1.26"
  E2E_IMAGE: "coordination-engine:e2e-test"

jobs:
  e2e-kind:
    name: E2E Kind Deploy + Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Build container image
        run: |
          echo "Building E2E test image: ${{ env.E2E_IMAGE }}"
          docker build -t ${{ env.E2E_IMAGE }} .

      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: coordination-engine-e2e
          wait: 5m

      - name: Load image into Kind
        run: |
          kind load docker-image ${{ env.E2E_IMAGE }} --name coordination-engine-e2e
          echo "Image loaded into Kind cluster"

      - name: Run E2E tests
        run: |
          echo "Running E2E tests against Kind cluster..."
          E2E_IMAGE=${{ env.E2E_IMAGE }} make test-e2e
        env:
          KUBECONFIG: ${{ env.HOME }}/.kube/config

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Pod status ==="
          kubectl get pods -A
          echo ""
          echo "=== Events ==="
          kubectl get events -n coordination-engine-e2e --sort-by='.lastTimestamp' || true
          echo ""
          echo "=== Pod logs ==="
          kubectl logs -n coordination-engine-e2e -l app.kubernetes.io/name=coordination-engine --tail=100 || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-kind-results
          path: |
            test/e2e/*.log
            coverage/*.out
          retention-days: 7
