info:
  contact: {}
  description: Kubernetes-native orchestration for multi-layer coordination in OpenShift
    clusters.
  title: OpenShift Coordination Engine API
  version: 1.2.0
paths:
  /api/v1/alerts:
    post:
      consumes:
      - application/json
      description: Matches firing alerts to SelfHealingPolicy entries and runs the
        model-gated repair for each match. Unmatched alerts return 200 with matched_policies
        0.
      parameters:
      - description: Alertmanager v4 webhook
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.AlertmanagerWebhook'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/policy.AlertsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.AlertsErrorResponse'
      summary: Accept an Alertmanager webhook
      tags:
      - policy
  /api/v1/anomalies/analyze:
    post:
      consumes:
      - application/json
      description: Queries Prometheus for metrics, performs 45-feature engineering,
        and calls KServe anomaly-detector model
      parameters:
      - description: Anomaly analysis request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.AnomalyAnalyzeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.AnomalyAnalyzeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.AnomalyErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/v1.AnomalyErrorResponse'
      summary: Analyze anomalies with ML-powered feature engineering
      tags:
      - anomaly
  /api/v1/capacity/cluster:
    get:
      description: Returns cluster-wide capacity analysis including total capacity,
        usage, and namespace breakdown
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.ClusterCapacityResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      summary: Get cluster-wide capacity analysis
      tags:
      - capacity
  /api/v1/capacity/namespace/{namespace}:
    get:
      description: Returns capacity analysis for a specific namespace including quota,
        usage, availability, trending, and infrastructure impact
      parameters:
      - description: Namespace name
        in: path
        name: namespace
        required: true
        type: string
      - description: 'Include trending analysis (default: true)'
        in: query
        name: include_trending
        type: boolean
      - description: 'Include infrastructure impact analysis (default: false)'
        in: query
        name: include_infrastructure
        type: boolean
      - description: 'Trending window - 7d, 14d, 30d (default: 7d)'
        in: query
        name: window
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.NamespaceCapacityResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      summary: Get namespace capacity analysis
      tags:
      - capacity
  /api/v1/coordination/trigger:
    post:
      consumes:
      - application/json
      description: Detects affected layers and starts a coordinated remediation workflow
      parameters:
      - description: Multi-layer remediation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.TriggerMultiLayerRemediationRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/v1.TriggerMultiLayerRemediationResponse'
        "400":
          description: Invalid request
          schema:
            type: string
        "500":
          description: Failed to generate plan
          schema:
            type: string
      summary: Trigger multi-layer remediation
      tags:
      - coordination
  /api/v1/coordination/workflows:
    get:
      description: Lists multi-layer coordination workflows known to this process
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.ListCoordinationWorkflowsResponse'
      summary: List coordination workflows
      tags:
      - coordination
  /api/v1/coordination/workflows/{id}:
    get:
      description: Returns one multi-layer coordination workflow
      parameters:
      - description: Workflow ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.CoordinationWorkflow'
        "404":
          description: workflow not found
          schema:
            type: string
      summary: Get a coordination workflow
      tags:
      - coordination
  /api/v1/detect:
    post:
      consumes:
      - application/json
      description: Proxies prediction requests to KServe InferenceServices
      parameters:
      - description: Detection request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/kserve.DetectRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/kserve.DetectResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      summary: Call KServe model for predictions
      tags:
      - kserve
  /api/v1/detect/cache/clear:
    post:
      description: Clears all cached deployment detection results
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.DetectionResponse'
      summary: Clear detection cache
      tags:
      - detection
  /api/v1/detect/cache/stats:
    get:
      description: Returns statistics about the detection cache
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get cache statistics
      tags:
      - detection
  /api/v1/detect/daemonset/{namespace}/{name}:
    get:
      description: Detects how a DaemonSet was deployed (ArgoCD, Helm, Operator, Manual)
      parameters:
      - description: Namespace
        in: path
        name: namespace
        required: true
        type: string
      - description: DaemonSet name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.DetectionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.DetectionResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.DetectionResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.DetectionResponse'
      summary: Detect deployment method for a DaemonSet
      tags:
      - detection
  /api/v1/detect/deployment/{namespace}/{name}:
    get:
      description: Detects how a Deployment was deployed (ArgoCD, Helm, Operator,
        Manual)
      parameters:
      - description: Namespace
        in: path
        name: namespace
        required: true
        type: string
      - description: Deployment name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.DetectionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.DetectionResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.DetectionResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.DetectionResponse'
      summary: Detect deployment method for a Deployment
      tags:
      - detection
  /api/v1/detect/statefulset/{namespace}/{name}:
    get:
      description: Detects how a StatefulSet was deployed (ArgoCD, Helm, Operator,
        Manual)
      parameters:
      - description: Namespace
        in: path
        name: namespace
        required: true
        type: string
      - description: StatefulSet name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.DetectionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.DetectionResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.DetectionResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.DetectionResponse'
      summary: Detect deployment method for a StatefulSet
      tags:
      - detection
  /api/v1/health:
    get:
      description: Reports Kubernetes, ML service, and RBAC dependency health
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.HealthResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/models.HealthResponse'
      summary: Cluster health check
      tags:
      - health
  /api/v1/incidents:
    get:
      description: Lists stored incidents and incidents derived from remediation workflows
      parameters:
      - description: Filter by namespace
        in: query
        name: namespace
        type: string
      - description: Filter by severity. all matches every severity
        in: query
        name: severity
        type: string
      - description: Filter by status. all matches every status
        in: query
        name: status
        type: string
      - description: Maximum rows to return. Defaults to 50
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.ListIncidentsResponse'
      summary: List incidents
      tags:
      - remediation
    post:
      consumes:
      - application/json
      description: Records an incident that can later be used to trigger remediation
      parameters:
      - description: Incident to create
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.CreateIncidentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/v1.CreateIncidentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.APIErrorResponse'
      summary: Create an incident
      tags:
      - remediation
  /api/v1/investigate/rca:
    post:
      consumes:
      - application/json
      description: Correlates pod events, network policies, and Istio config for a
        service over a time window
      parameters:
      - description: RCA investigation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.RCAInvestigateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rca.Result'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.RCAErrorResponse'
      summary: Investigate a root cause
      tags:
      - rca
  /api/v1/models:
    get:
      description: Returns a list of all registered KServe InferenceServices
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.ModelsListResponse'
      summary: List all registered KServe models
      tags:
      - kserve
  /api/v1/models/{model}/health:
    get:
      description: Checks the health status of a specific KServe model
      parameters:
      - description: Model name
        in: path
        name: model
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/kserve.ModelHealthResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      summary: Check KServe model health
      tags:
      - kserve
  /api/v1/predict:
    post:
      consumes:
      - application/json
      description: Provides time-specific resource usage predictions using KServe
        ML models and Prometheus metrics
      parameters:
      - description: Prediction request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.PredictRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.PredictResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.PredictErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/v1.PredictErrorResponse'
      summary: Get time-specific resource usage predictions
      tags:
      - prediction
  /api/v1/predict/disk-exhaustion:
    get:
      description: Computes days-until-full for all monitored filesystems using a
        7-day
      parameters:
      - description: Filter by node name
        in: query
        name: node
        type: string
      - description: Filter by mount path (e.g. /)
        in: query
        name: mountpoint
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.DiskExhaustionResponse'
      summary: Predict disk exhaustion ETA per node/filesystem
      tags:
